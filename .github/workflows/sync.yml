name: Sync Toddle to Todoist

on:
  schedule:
    - cron: "3,33 * * * *"  # every 30 minutes, offset from :00/:30 to dodge
                            # GitHub's documented high-load congestion at the
                            # top of every hour
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit synced_links.json back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python toddle_todoist_sync.py
        env:
          TODDLE_ICS_URL: ${{ secrets.TODDLE_ICS_URL }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          TODOIST_PROJECT_ID: ${{ secrets.TODOIST_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save updated sync state
        run: |
          git config user.name "toddle-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add synced_links.json
          git diff --staged --quiet || git commit -m "Update synced links"
          git push
